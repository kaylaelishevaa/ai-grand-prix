function hatch(){if(state.hatched)return;state.hatched=true;render();}
function chooseDuel(choice){if(state.duelRound>=6)return;const round=state.duelRound,o=DATA.duels[round].options[choice];state.picks[round]=choice;state.forgotten.delete('taste'+round);addMemory('taste'+round,o.memory,'from your taste duels, today');state.duelRound++;state.xp=state.duelRound*10;render();if(state.duelRound===3||state.duelRound===6)toast('Level '+Math.floor(state.duelRound/3)+' unlocked · playing looks good on you.');}
function runVoice(){const token=++state.voiceRun;state.voiceText='';state.voicePhase='typing';render();const type=i=>{if(token!==state.voiceRun)return;if(i<=DATA.voiceQuery.length){state.voiceText=DATA.voiceQuery.slice(0,i);const q=$('.ask-query',currentScreen);if(q)q.innerHTML=safe(state.voiceText)+'<span class="cursor"></span>';later(()=>type(i+1),26);}else{state.voicePhase='thinking';render();later(()=>{if(token!==state.voiceRun)return;state.voicePhase='done';render();},1100);}};later(()=>type(1),500);}

function startScan(){state.scanStep=0;state.groceryCount=0;render();[800,1900,3200].forEach((ms,i)=>later(()=>{state.scanStep=i+1;render();if(i===2){parent.postMessage({type:'coupi-guided-memory',chapter:'fridge'},location.origin);scrollEnd();}},ms));DATA.groceries.forEach((_,i)=>later(()=>{state.groceryCount=i+1;render();scrollEnd();},4400+i*700));}
function changeVibe(value){state.variant=value;state.swaps={};render();}
function advanceStroll(value,reason){if(state.strollDone)return;if(value==='nah'&&!reason){state.strollFeedback=true;render();return;}if(value==='ooh'){state.saved.add(state.strollIndex);state.strollNote='Ooh, noted. Saved for a little later.';}else if(reason==='too pricey'){state.priceSensitive=true;state.strollNote='noted — same vibe, under ₩30k.';addMemory('taste4','budget-conscious','from your stroll, today');}else if(reason==='not my style'){state.strollNote='Fair. Let’s try a different shape.';addMemory('taste2','prefers quieter, simpler shapes','from your stroll, today');}else if(reason==='have one'){state.strollNote='One is plenty. No duplicates from me.';}else state.strollNote=state.priceSensitive?'Still keeping it under ₩30k.':'No pressure. Here’s another little possibility.';state.strollFeedback=false;state.strollIndex++;if(state.strollIndex>=5)state.strollDone=true;render();}
function forget(id){if(!state.memory.some(m=>m.id===id))return;state.forgotten.add(id);state.memory=state.memory.filter(m=>m.id!==id);const row=$('#memory-'+id);if(row)row.classList.add('removing');toast('forgotten.');later(()=>{render();const speech=$('.speech',currentScreen);if(speech)speech.textContent='forgotten.'},300);}
function changeLicense(category){state.licenses[category]=!state.licenses[category];const detail=state.licenses[category]?'auto under '+won(category==='groceries'?state.groceryLimit:30000)+' ✓':'always ask';state.permissionLog.push('09:'+String(42+state.permissionLog.length-2).padStart(2,'0')+' · '+category+': '+detail);render();const log=$('.permission-log');if(log)log.scrollTop=log.scrollHeight;}

function exportMemory(){const data={format:'coupi-taste-passport',version:1,simulation:true,owner:'you',memory:state.memory.map(x=>({...x})),budget:{monthlyKRW:state.budget},permissions:{groceries:{auto:state.licenses.groceries,limitKRW:state.groceryLimit},electronics:{auto:state.licenses.electronics,limitKRW:30000}},permissionLog:[...state.permissionLog],note:'Your profile is yours, not the platform’s. Synthetic prototype data.'};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='coupi-taste-passport.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Your head, to go. JSON passport downloaded.');}

function handleAction(action,el){const index=Number(el?.dataset.index||0),value=el?.dataset.value;switch(action){case'jump':go(index);break;case'prev':go(state.beat-1);break;case'next':go(state.beat+1);break;case'reset':reset();break;case'autoplay':toggleAutoplay();break;case'hatch':hatch();break;case'duel':chooseDuel(index);break;case'hotspot':state.sheetWhy=false;showProduct(index);break;case'watched-kettle':state.sheetWhy=false;showProduct(0);break;case'close-overlay':closeOverlay();break;case'why-product':showProductEvaluation();break;case'swap-product':{const id=DATA.products[state.hotspot].id;state.swaps[id]=!state.swaps[id];state.sheetWhy=false;showProduct(state.hotspot);break;}case'add-product':{const base=DATA.products[state.hotspot],p=sceneProduct(state.hotspot);state.added.set(base.id,p);state.selected.add(base.id);showProduct(state.hotspot);toast('In your decision queue. Nothing bought.');break;}case'replay-duels':state.duelRound=0;state.picks=[];go(1);break;case'voice':runVoice();break;case'why-verdict':showEvaluation();break;case'review-citation':showReviewCitation(el.dataset.reviewKey,el.dataset.reviewId,el.dataset.context||'product');break;case'raw-reviews':showRawReviews(el.dataset.scope||'evaluation');break;case'review-back':state.reviewContext==='evaluation'?closeOverlay():showProduct(state.hotspot);break;case'citation':showCitation(index);break;case'approve-socks':state.voiceApproved=true;state.approved.add('socks');state.selected.add('socks');render();toast('Approved in this simulation. Arrives tomorrow, 7am.');break;case'swap-socks':state.voiceSwap=!state.voiceSwap;state.voiceApproved=false;state.approved.delete('socks');render();break;case'see-everything':showOldGrid();break;case'queue-cooker':state.selected.add('cooker');render();toast('Queued for your approval.');break;case'call-mic':toast('Scripted call · no microphone is recording.');break;case'call-camera':toast('Prepared illustration · no camera is accessed.');break;case'end-call':case'review-groceries':go(9);break;case'vibe':changeVibe(value);break;case'stroll':advanceStroll(value);break;case'stroll-reason':advanceStroll('nah',value);break;case'stop-stroll':go(9);break;case'another-lap':state.strollIndex=0;state.strollDone=false;state.strollFeedback=false;state.strollNote='Another five. Then we’ll check in again.';render();break;case'approve-haggle':state.haggleApproved=true;render();toast('Deal approved. Rice cooker now ₩65,000.');break;case'approve-selected':approveSelected();break;case'forget':forget(value);break;case'license':changeLicense(value);break;case'export':exportMemory();break;case'negotiate':negotiate();break;case'inverse':state.inverseOpen=!state.inverseOpen;render();break;case'closing':scrollEnd();break;}}

/* A single review object powers every snippet, count, citation and raw-evidence view. */
function reviewSet(key){return DATA.reviews[key]||[];}
function reviewStats(key,tag){const reviews=reviewSet(key),matching=reviews.filter(r=>r.tags.includes(tag));return {total:reviews.length,matching,count:matching.length,percent:Math.round(matching.length/reviews.length*100),average:(reviews.reduce((sum,r)=>sum+r.stars,0)/reviews.length).toFixed(1)};}
function reviewMeta(key){return DATA.reviewMeta[key]||{name:key,type:'kettle',tag:'',claim:'a reported issue'};}
function reviewStars(n){return `<span class="review-stars" aria-label="${n} of 5 stars">${'★'.repeat(n)}<span>${'★'.repeat(5-n)}</span></span>`;}
function reviewMarkup(key,r,full=true){const meta=reviewMeta(key);return `<article class="raw-review" id="review-${r.id}"><div class="review-top">${reviewStars(r.stars)}<span class="review-id">${r.id}</span></div><div class="review-byline"><b>${safe(r.author)}</b><span>${r.date} · purchase review</span></div><p class="review-product">${safe(meta.name)}</p><h3>${safe(r.title)}</h3><p class="review-body">${safe(r.text)}</p>${r.photo?`<details class="review-photo"><summary>▧ Photo attached <span>prepared illustration</span></summary><div>${productArt(meta.type)}</div></details>`:''}<div class="review-helpful">Helpful ${r.helpful.toLocaleString('en-US')} <span>· seeded count</span></div></article>`;}
function citationChips(key,tag,context='product'){const s=reviewStats(key,tag);return `<div class="citation-row">${s.matching.slice(0,2).map((r,i)=>`<button class="citation" data-action="review-citation" data-review-key="${key}" data-review-id="${r.id}" data-context="${context}">↗ ${String(i+1).padStart(2,'0')} · ${r.id} · ${r.stars}★ review</button>`).join('')}</div>`;}
function reviewDissent(key){const meta=reviewMeta(key),s=reviewStats(key,meta.tag);return `${s.percent}% of reviews: ${meta.claim} <span class="count-evidence">(${s.count} of ${s.total}; rounded)</span>`;}
function showReviewCitation(key,id,context='product'){
 const r=reviewSet(key).find(r=>r.id===id);if(!r)return;

}

/*
 * COUPI swipe deck — plain offline JavaScript, no dependencies.
 *
 * Markup (the passed element is the FRONT card, not the deck wrapper):
 *   <div class="swipe-card">
 *     <span class="swipe-stamp right" aria-hidden="true">OOH</span>
 *     <span class="swipe-stamp left" aria-hidden="true">SKIP</span>
 *     ...product art and text...
 *   </div>
 *
 * Position the stamps with CSS; .right is the green OOH stamp, .left is
 * the gray SKIP stamp. They are optional. Put layout/centering transforms
 * on a wrapper: this helper owns the card's transform while active.
 * It sets touch-action:pan-y so vertical mobile scrolling remains native.
 *
 * const deck = createSwipeDeck(card, direction => advanceCard(direction));
 * deck.swipe('right'); // fallback OOH button; same 320ms fly-off animation
 * deck.swipe('left');  // fallback SKIP button
 * deck.destroy();     // call BEFORE every rerender/navigation/reset
 *
 * swipe() returns true when accepted, false when busy/destroyed/invalid.
 * onSwipe fires once AFTER the card flies away; replace/reinitialize the card
 * in that callback. A completed card stays spent until replaced/destroyed.
 * Child buttons/inputs/links and [data-no-swipe] remain ordinary controls.
 * A horizontal drag's synthetic click is swallowed, so it cannot trigger
 * a surrounding "tap anywhere to continue" handler.
 */
function createSwipeDeck(el, onSwipe) {
  if (!el || typeof el.addEventListener !== 'function') {
    throw new TypeError('createSwipeDeck needs a card element.');
  }
  if (typeof onSwipe !== 'function') {
    throw new TypeError('createSwipeDeck needs an onSwipe callback.');
  }

  const rightStamp = el.querySelector('.swipe-stamp.right');
  const leftStamp = el.querySelector('.swipe-stamp.left');
  const stamps = [rightStamp, leftStamp].filter(Boolean);
  const saved = {};
  const properties = ['transform', 'transition', 'opacity', 'willChange', 'touchAction', 'userSelect', 'cursor'];
  properties.forEach(name => saved[name] = el.style[name]);
  const savedStamps = stamps.map(stamp => ({
    stamp,
    opacity: stamp.style.opacity,
    transform: stamp.style.transform,
    transition: stamp.style.transition
  }));
  const interactiveSelector = 'button,a,input,textarea,select,option,label,[contenteditable="true"],[role="button"],[data-no-swipe]';
  let destroyed = false;
  let phase = 'ready';
  let gesture = null;
  let frame = 0;
  let timer = 0;
  let x = 0;
  let suppressClickUntil = 0;
  const clock = () => performance.now();

  el.style.touchAction = 'pan-y';
  el.style.userSelect = 'none';
  el.style.willChange = 'transform, opacity';
  el.style.cursor = 'grab';
  stamps.forEach(stamp => { stamp.style.opacity = '0'; });

  function ignoreTarget(target) {
    return !!(target && typeof target.closest === 'function' && target.closest(interactiveSelector));
  }

  function cancelFrame() {
    if (frame) cancelAnimationFrame(frame);
    frame = 0;
  }

  function release(pointerId) {
    try {
      if (el.hasPointerCapture(pointerId)) el.releasePointerCapture(pointerId);
    } catch (_) { /* A native scroll may already have released capture. */ }
  }

  function paint(value) {
    const angle = Math.max(-20, Math.min(20, value / 14));
    el.style.transform = 'translate3d(' + value + 'px,0,0) rotate(' + angle + 'deg)';
    const strength = Math.min(1, Math.abs(value) / 75);
    if (rightStamp) {
      rightStamp.style.opacity = value > 0 ? String(strength) : '0';
      rightStamp.style.transform = 'rotate(-14deg) scale(' + (.9 + strength * .1) + ')';
    }
    if (leftStamp) {
      leftStamp.style.opacity = value < 0 ? String(strength) : '0';
      leftStamp.style.transform = 'rotate(14deg) scale(' + (.9 + strength * .1) + ')';
    }
  }

  function schedulePaint() {
    if (frame) return;
    frame = requestAnimationFrame(() => {
      frame = 0;
      if (!destroyed) paint(x);
    });
  }

  function sample(g, clientX, time) {
    g.samples.push({ x: clientX, time });
    // A recent 100ms window measures the release flick, not the whole drag.
    while (g.samples.length > 2 && time - g.samples[1].time > 100) g.samples.shift();
  }

  function springBack() {
    cancelFrame();
    phase = 'returning';
    el.style.cursor = 'grab';
    el.style.transition = 'transform 380ms cubic-bezier(.2,1.45,.35,1)';
    stamps.forEach(stamp => { stamp.style.transition = 'opacity 280ms ease, transform 280ms ease'; });
    x = 0;
    paint(0);
    timer = setTimeout(() => {
      timer = 0;
      if (destroyed) return;
      el.style.transition = 'none';
      stamps.forEach(stamp => { stamp.style.transition = 'none'; });
      phase = 'ready';
    }, 380);
  }

  function fly(direction, velocity) {
    if (destroyed || phase !== 'ready') return false;
    phase = 'flying';
    cancelFrame();
    if (gesture) {
      const pointerId = gesture.id;
      gesture = null; // Clear first: release may emit lostpointercapture.
      release(pointerId);
    }
    el.style.cursor = 'grab';
    paint(x);
    const bounds = el.getBoundingClientRect();
    const viewportWidth = window.innerWidth || document.documentElement.clientWidth || 1024;
    const sign = direction === 'right' ? 1 : -1;
    const distance = direction === 'right'
      ? viewportWidth - bounds.left + bounds.width + 80
      : bounds.right + bounds.width + 80;
    const rotation = sign * (18 + Math.min(14, Math.abs(velocity || 0) * 10));
    const activeStamp = direction === 'right' ? rightStamp : leftStamp;
    const inactiveStamp = direction === 'right' ? leftStamp : rightStamp;
    if (activeStamp) activeStamp.style.opacity = '1';
    if (inactiveStamp) inactiveStamp.style.opacity = '0';
    suppressClickUntil = clock() + 600;
    // One frame separates the drag pose from the destination pose.
    frame = requestAnimationFrame(() => {
      frame = 0;
      if (destroyed) return;
      el.style.transition = 'transform 320ms cubic-bezier(.18,.72,.28,1), opacity 320ms ease';
      el.style.transform = 'translate3d(' + (sign * distance) + 'px,0,0) rotate(' + rotation + 'deg)';
      el.style.opacity = '0';
      timer = setTimeout(() => {
        timer = 0;
        if (destroyed) return;
        phase = 'spent';
        onSwipe(direction);
      }, 320);
    });
    return true;
  }

  function onDown(event) {
    if (destroyed || phase !== 'ready' || gesture || event.isPrimary === false) return;
    if (event.button !== 0 || ignoreTarget(event.target)) return;
    const time = clock();
    gesture = {
      id: event.pointerId, startX: event.clientX, startY: event.clientY,
      horizontal: false, samples: [{ x: event.clientX, time }]
    };
    try { el.setPointerCapture(event.pointerId); } catch (_) { /* Detached cards are destroyed by the owner. */ }
  }

  function onMove(event) {
    const g = gesture;
    if (!g || event.pointerId !== g.id || destroyed) return;
    const dx = event.clientX - g.startX;
    const dy = event.clientY - g.startY;
    if (!g.horizontal) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 8) return;
      if (Math.abs(dx) <= Math.abs(dy)) {
        gesture = null;
        release(g.id);
        return; // Vertical intention: leave native pan-y scrolling alone.
      }
      g.horizontal = true;
      el.style.transition = 'none';
      el.style.cursor = 'grabbing';
      stamps.forEach(stamp => { stamp.style.transition = 'none'; });
    }
    if (event.cancelable) event.preventDefault();
    x = dx;
    sample(g, event.clientX, clock());
    suppressClickUntil = clock() + 600;
    schedulePaint();
  }

  function finish(event, cancelled) {
    const g = gesture;
    if (!g || event.pointerId !== g.id || destroyed) return;
    gesture = null;
    release(g.id);
    if (!g.horizontal) return;
    suppressClickUntil = clock() + 600;
    if (cancelled) { springBack(); return; }
    x = event.clientX - g.startX;
    sample(g, event.clientX, clock());
    const first = g.samples[0];
    const last = g.samples[g.samples.length - 1];
    const velocity = (last.x - first.x) / Math.max(1, last.time - first.time);
    const distanceEnough = Math.abs(x) >= 75;
    const flickEnough = Math.abs(x) >= 20 && Math.abs(velocity) >= .5;
    if (distanceEnough || flickEnough) {
      const sign = distanceEnough ? Math.sign(x) : Math.sign(velocity);
      fly(sign > 0 ? 'right' : 'left', velocity);
    } else springBack();
  }

  const onUp = event => finish(event, false);
  const onCancel = event => finish(event, true);
  const onLostCapture = event => {
    if (gesture && event.pointerId === gesture.id) finish(event, true);
  };
  const onClick = event => {
    if (clock() < suppressClickUntil && !ignoreTarget(event.target)) {
      event.preventDefault();
      event.stopPropagation();
    }
  };
  const onDragStart = event => { if (!ignoreTarget(event.target)) event.preventDefault(); };

  el.addEventListener('pointerdown', onDown);
  el.addEventListener('pointermove', onMove, { passive: false });
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onCancel);
  el.addEventListener('lostpointercapture', onLostCapture);
  el.addEventListener('click', onClick, true);
  el.addEventListener('dragstart', onDragStart);

  return {
    swipe(direction) {
      if (direction !== 'right' && direction !== 'left') return false;
      return fly(direction, direction === 'right' ? 1 : -1);
    },
    destroy() {
      if (destroyed) return;
      destroyed = true;
      cancelFrame();
      clearTimeout(timer);
      timer = 0;
      if (gesture) {
        const pointerId = gesture.id;
        gesture = null;
        release(pointerId);
      }
      el.removeEventListener('pointerdown', onDown);
      el.removeEventListener('pointermove', onMove);
      el.removeEventListener('pointerup', onUp);
      el.removeEventListener('pointercancel', onCancel);
      el.removeEventListener('lostpointercapture', onLostCapture);
      el.removeEventListener('click', onClick, true);
      el.removeEventListener('dragstart', onDragStart);
      properties.forEach(name => { el.style[name] = saved[name]; });
      savedStamps.forEach(({ stamp, opacity, transform, transition }) => {
        stamp.style.opacity = opacity;
        stamp.style.transform = transform;
        stamp.style.transition = transition;
      });
    }
  };
}

/* V2 story controller. Screen components above are reused inside a place, never a beat menu. */
let deckController=null,narrationTimer=null,storyEntered=false,worldRevision=0;
function stopDeck(){if(deckController){deckController.destroy();deckController=null;}}
function updateChrome(){
 if(!state||!DATA.story)return;
 const c=DATA.story[state.chapter||0];
 $('#app-brand').innerHTML=pet()+'<span>coupi<span style="color:#e6a65e">.</span></span>';
 $('#level-pill').textContent=state.xp>=60?'Lv. 2 · getting you':state.xp>=30?'Lv. 1 · curious':state.hatched?'Lv. 0 · just met':'Lv. 0 · just a little egg';
 $('#phone').classList.toggle('dark',(state.chapter===0&&!state.askOpen));
 $('#time-label').textContent=c.time+' — '+c.place;const clockText=$('.status-bar>span');if(clockText)clockText.textContent=/AM|PM/.test(c.time)?c.time.replace(/ AM| PM/g,''):'9:41';
 $('#time-track').innerHTML=DATA.story.filter((x,i)=>i===0||x.time!==DATA.story[i-1].time).map((x,i)=>`<i class="${i<=state.chapter?'lived':''}"></i>`).join('');
 $('#pitch-caption').textContent=state.askOpen?'replaces search':state.chapter===2?'replaces category browsing':state.chapter===4?'replaces the grocery list':c.caption;
 $('#chapter-eyebrow').textContent=c.kicker;
 $('#chapter-title').innerHTML=c.title.replace(/<br>/g,'<br> ');
 $('#chapter-copy').textContent=c.copy;
 $('#dev-panel').innerHTML='<div class="eyebrow">Rehearsal only · D to hide</div>'+DATA.story.map((x,i)=>`<button class="${i===state.chapter?'active':''}" data-action="dev-jump" data-index="${i}">${x.time} · ${x.place}</button>`).join('');
 const label=continueLabel();$('#continue-label').textContent=label;$('#continue-button').setAttribute('aria-label',label);$('#continue-button').disabled=(state.chapter===1&&state.duelRound<6)||(state.chapter===5&&!state.strollDone&&!state.strollFeedback)||(state.chapter===3&&state.callStarted&&state.callStep<4)||(state.chapter===4&&state.fridgeAllowed&&state.groceryCount<5);
 $('#story-app').className='story-app chapter-'+state.chapter+(c.night?' night':'')+(state.askOpen?' ask-open':'')+((c.phone||state.askOpen)?' phone-mode':' scene-mode');if(state.askOpen){$('#chapter-eyebrow').textContent='ONE QUESTION. THE WHOLE TRAIL.';$('#chapter-title').innerHTML='Ask it in <em>your words.</em>';}
}
function continueLabel(){if(state.askOpen)return 'Back to the kitchen';switch(state.chapter){case 0:return state.hatched?'Next: the bus':'Hatch COUPI';case 1:return state.duelRound>=6?'Next: lunch break':'Swipe six cards';case 2:return 'Next: the store';case 3:return !state.callStarted?'Call COUPI':state.callStep<4?'A second opinion…':'Head home';case 4:return !state.fridgeOpen?'Open the fridge':!state.fridgeAllowed?'Yes, have a look':state.groceryCount<5?'Making a little plan…':'Into Decisions';case 5:return state.strollDone?'Next: lights out':state.strollFeedback?'Skip without a reason':'Swipe five finds';case 6:return state.impulseHeld?'Let it wait till morning':'Add to Decisions';case 7:return 'One more little thing';case 8:return state.antiSellDone?'Review your decisions':'Add detergent';case 9:return 'Take a peek inside';case 10:return 'See what changed';case 11:return 'Where does this go?';case 12:return 'The closing thought';default:return 'Live it all over again';}}
function narrate(text){clearTimeout(narrationTimer);const el=$('#story-narration');if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=text;return;}let i=0;el.innerHTML='<span></span><i class="narration-caret"></i>';const line=el.firstElementChild;const tick=()=>{if(!line.isConnected)return;line.textContent=text.slice(0,++i);if(i<text.length)narrationTimer=setTimeout(tick,24);else $('.narration-caret',el)?.remove();};tick();}
function renderWorld(){const c=DATA.story[state.chapter],old=$('.world-layer:not(.leaving)');const world=document.createElement('div');world.className='world-layer';world.innerHTML=worldArt(c.world,!!c.night);if(old){old.classList.add('leaving');const tid=setTimeout(()=>{old.remove();transitionTimers.delete(tid);},450);transitionTimers.add(tid);}$('#worlds').appendChild(world);worldRevision++;}
function enterChapter(index){
 if(index<0||index>=DATA.story.length)return;
 stopDeck();clearTimers();clearTimeout(narrationTimer);revision++;closeOverlay(false);$('#toast').textContent='';
 state.chapter=index;state.askOpen=false;state.auto=false;state.beat=DATA.story[index].screen;
 if(index>0)state.hatched=true;
 if(index>=2){seedMemory(index>=3?8:6);if(state.picks.length<6&&state.duelRound===0){state.picks=[0,0,0,0,0,0];state.duelRound=6;}}
 if(index===3){state.callStarted=false;state.callStep=0;}
 if(index===4){state.fridgeOpen=false;state.fridgeAllowed=false;state.scanStep=0;state.groceryCount=0;}
 if(index===5){state.strollIndex=0;state.strollDone=false;state.strollFeedback=false;state.strollNote='A few quiet finds. No bottomless feed.';}
 if(index===12&&state.negotiating){state.negotiating=false;state.negotiationStep=0;state.negotiationRun++;}
 renderWorld();
 const stack=$('#screen-stack');stack.innerHTML='';currentScreen=document.createElement('section');currentScreen.className='screen entering';currentScreen.id='active-screen';stack.appendChild(currentScreen);
 $('#epilogue-panel').hidden=true;$('#closing-world').hidden=true;
 render();narrate(DATA.story[index].narration);
 const dock=$('#phone-dock');if(!dock.classList.contains('is-away')){dock.classList.remove('is-entering');void dock.offsetWidth;dock.classList.add('is-entering');}
 $('#story-status').textContent=DATA.story[index].time+', '+DATA.story[index].place;
 storyEntered=true;
}
function go(index){const map={0:0,1:1,2:2,3:7,4:2,5:3,6:4,7:2,8:5,9:9,10:10,11:11,12:12};if(index===4){if(state.chapter!==2)enterChapter(2);openAsk();}else enterChapter(map[index]??index);}
function render(){
 if(!state||!DATA.story)return;
 stopDeck();const c=DATA.story[state.chapter],phoneVisible=c.phone||state.askOpen;
 const dock=$('#phone-dock');dock.hidden=!phoneVisible;dock.classList.toggle('is-away',!phoneVisible);dock.setAttribute('aria-hidden',String(!phoneVisible));dock.inert=!phoneVisible;if(!phoneVisible)dock.classList.remove('is-entering');
 $('#interactive-world').innerHTML='';$('#epilogue-panel').hidden=state.chapter!==12;$('#closing-world').hidden=state.chapter!==13;
 let phoneScreen=$('#active-screen');
 if(state.chapter===12){const panel=$('#epilogue-panel');const y=panel.scrollTop;$('#epilogue-content').innerHTML=screens[12]();currentScreen=panel;panel.scrollTop=y;}
 else if(state.chapter===13){$('#closing-world').innerHTML=`${pet('happy')}<div class="era"><b>ERA 1</b>Shopping was a place.</div><div class="era"><b>ERA 2</b>The store moved into our hands —<br>but the interface stayed the same.</div><div class="era"><b>ERA 3</b></div><h1>The store<br>becomes <em>someone.</em></h1><div class="closing-wordmark">COUPI.</div>`;}
 else if(phoneVisible){currentScreen=phoneScreen;const y=phoneScreen.scrollTop;phoneScreen.classList.toggle('deck-screen',state.chapter===1||state.chapter===5);phoneScreen.setAttribute('aria-label',c.place+' · '+c.time);phoneScreen.innerHTML=state.askOpen?screens[4]():storyPhone();phoneScreen.scrollTop=y;}
 else currentScreen=phoneScreen;
 if(state.chapter===1)renderMemoryPeek();
 if(state.chapter===2)renderKitchenWorld();
 if(state.chapter===3)renderStoreWorld();
 if(state.chapter===4)renderFridgeWorld();
 if((state.chapter===1&&state.duelRound<6)||(state.chapter===5&&!state.strollDone&&!state.strollFeedback))wireDeck();
 if(state.chapter===10)wireMemoryRows();
 updateChrome();
 requestAnimationFrame(applyWarmFuturism);
}
function storyPhone(){switch(state.chapter){case 0:return screens[0]();case 1:return tasteDeck();case 5:return strollDeck();case 6:return impulseScreen();case 7:return morningScreen();case 8:return antiSellScreen();case 9:return morningDecisions();case 10:return screens[10]();case 11:return screens[11]().replace('THIS WEEK, WITH COUPI','YESTERDAY, WITH COUPI').replace('The learning curve.<br>In your favor.','Yesterday was different.').replace('And where does this go? →','Where does this go? →');default:return '';}}
function cardDeck(p,kind){return `<div class="swipe-stack deck-card-enter"><article class="swipe-card" data-deck="${kind}" tabindex="0" aria-label="${safe(p.name)}. Drag right for ooh or left to skip."><span class="swipe-stamp right" aria-hidden="true">OOH</span><span class="swipe-stamp left" aria-hidden="true">SKIP</span>${productArt(p.type,p.color)}<div class="swipe-item-info"><div><h3>${p.name}</h3><p>${p.detail||p.tag||''}</p></div>${p.price?`<strong class="swipe-price">${won(p.price)}</strong>`:''}</div></article></div><div class="deck-buttons"><button data-action="deck-left" aria-label="Swipe left: skip">× Skip</button><span class="deck-tip">← skip · ooh →<br>drag, or tap a button</span><button data-action="deck-right" aria-label="Swipe right: ooh">♡ Ooh</button></div>`;}
function tasteDeck(){if(state.duelRound>=6)return `<div class="deck-done">${pet('happy')}<div class="eyebrow orange">A LITTLE CHEMISTRY</div><h2>Okay. I’m starting<br>to get you.</h2><p>Six swipes on a bus.<br>A whole little world in the making.</p><div class="xp-row"><span>LEVEL 2</span><div class="xp-track"><div class="xp-fill" style="transform:scaleX(1)"></div></div><span>60 XP</span></div>${btn('See where this goes →','story-continue','soft')}</div>`;const d=DATA.duels[state.duelRound].options[0];return `<div class="deck-heading"><h2>A little more you.</h2><span>${state.duelRound+1} / 6</span></div>${cardDeck(d,'taste')}<div class="inline-memory" aria-live="polite">${state.duelRound?`✧ ${safe(state.memory.find(m=>m.id==='taste'+(state.duelRound-1))?.text||'Noted.')} ✓`:'Your memory starts with this swipe.'}</div><div class="xp-row"><span>LEVEL ${Math.floor(state.duelRound/3)}</span><div class="xp-track"><div class="xp-fill" style="transform:scaleX(${state.duelRound/6})"></div></div><span>${state.duelRound*10} XP</span></div><p class="deck-bottom-note">Twelve minutes to your stop. Plenty of time.</p>`;}
function renderMemoryPeek(){const panel=document.createElement('aside');panel.className='memory-peek';panel.setAttribute('aria-label','Live memory sheet');panel.innerHTML=`<div class="memory-mini-header"><b>A peek inside my head</b><span>✧ LIVE</span></div>${state.memory.filter(m=>m.id.startsWith('taste')).map(m=>`<div class="memory-line"><span>${safe(m.text)}</span><span>✓</span></div>`).join('')||'<p class="hint">An empty page. Your move.</p>'}<div class="xp-row"><span>LEVEL ${Math.floor(state.duelRound/3)}</span><div class="xp-track"><div class="xp-fill" style="transform:scaleX(${state.duelRound/6})"></div></div><span>${state.duelRound*10} XP</span></div>`;$('#interactive-world').appendChild(panel);}
function wireDeck(){const el=$('.swipe-card');if(!el)return;const kind=el.dataset.deck;deckController=createSwipeDeck(el,direction=>{if(kind==='taste')tasteSwipe(direction);else strollSwipe(direction);});}
function tasteSwipe(direction){if(state.duelRound>=6)return;const i=state.duelRound,d=DATA.duels[i].options[0],liked=direction==='right';state.picks[i]=liked?0:2;state.forgotten.delete('taste'+i);addMemory('taste'+i,liked?d.memory:DATA.swipeSkips[i],'from your bus swipes, day one');state.duelRound++;state.xp=state.duelRound*10;render();if(state.duelRound===3)toast('Level 1 · a little more familiar.');if(state.duelRound===6){toast('Level 2 · raised by play, never by spending.');/* The next action stays explicit after the last swipe. */}}
function strollDeck(){if(state.strollDone)return `<div class="deck-done">${pet()}<div class="eyebrow orange">FIVE FINDS. A FINISH LINE.</div><h2>That’s one lap.<br>Sleep?</h2><p>No streak to protect.<br>No bottom to chase.</p>${btn('Sleep sounds pretty good.','story-continue')}<button class="text-link" data-action="another-lap">One more little lap</button></div>`;const p=strollItem();return `<div class="deck-heading"><h2>A quiet little wander.</h2><span>${state.strollIndex+1} / 5</span></div>${state.strollFeedback?`<div class="swipe-stack" style="height:220px"><article class="swipe-card" style="cursor:default">${productArt(p.type)}<div class="swipe-item-info"><h3>${p.name}</h3><strong class="swipe-price">${won(p.price)}</strong></div></article></div><div class="feedback-chips"><p>A little clue before the next one?</p><div class="chips">${['too pricey','not my style','have one'].map(x=>`<button class="chip" data-action="stroll-reason" data-value="${x}">${x}</button>`).join('')}<button class="chip" data-action="stroll-browse">just browsing</button></div></div>`:cardDeck(p,'stroll')}<p class="deck-bottom-note" aria-live="polite">${state.strollNote}</p>`;}
